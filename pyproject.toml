[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-intelligence"
version = "0.1.0"
description = "Local-first news intelligence system"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
